body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 'Open Sans',Vazirmatn,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:clip;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
html[lang=fa] body{font-family:Vazirmatn,'Open Sans',system-ui,sans-serif}
a{color:inherit}
.blob{position:fixed;width:440px;height:440px;border-radius:50%;filter:blur(100px);opacity:.18;pointer-events:none;z-index:0;animation:drift 40s ease-in-out infinite alternate}
.b1{background:var(--acc2);top:-140px;inset-inline-end:-140px}.b2{background:var(--or);bottom:-200px;inset-inline-start:-160px;opacity:.12;animation-delay:-14s}
@keyframes drift{to{transform:translate(50px,36px) scale(1.1)}}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 20px 40px}
.top{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 -20px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font:600 14px 'JetBrains Mono',monospace;color:var(--mute);text-decoration:none;white-space:nowrap}.logo b{color:var(--acc)}
nav#nav{display:flex;gap:4px;margin-inline-start:auto;margin-inline-end:10px;align-items:center}
nav#nav a{padding:8px 12px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:500;color:var(--mute);transition:color .4s var(--ease),background .4s var(--ease)}
nav#nav a:hover{color:var(--ink);background:var(--glow)}
nav#nav a.on{color:var(--acc);background:var(--glow)}
nav#nav a.c{background:var(--or);color:var(--onor);font-weight:600}
nav#nav a.c:hover{filter:brightness(1.06)}
#menu{display:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .5s var(--ease)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:12px;font:600 14px/1.2 inherit;font-family:inherit;cursor:pointer;text-decoration:none;transition:transform .4s var(--ease),border-color .4s var(--ease),box-shadow .4s var(--ease),filter .4s}
.btn i{display:inline-flex}
.stm{transform-box:fill-box;transform-origin:50% 100%;animation:steam 3.6s ease-in-out infinite}
.stm.s2{animation-delay:1s}.stm.s3{animation-delay:2s}
@keyframes steam{0%{opacity:0;transform:translateY(3px) scaleY(.5)}30%{opacity:1}70%{opacity:.85}100%{opacity:0;transform:translateY(-3.5px) scaleY(1.15)}}.btn svg.i{width:18px;height:18px}
.btn:hover{transform:translateY(-2px);border-color:var(--acc)}.btn:active{transform:scale(.98)}
.btn:hover svg.i{transform:translateY(-1px) scale(1.08)}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.btn.pri{background:var(--or);color:var(--onor);border-color:var(--or)}
.btn.pri:hover{border-color:var(--or);filter:brightness(1.07);box-shadow:0 10px 28px var(--glow-or)}
.btn.icon{padding:10px 12px}
.btn[disabled]{opacity:.6;pointer-events:none}
.cta{padding:14px 24px;font-size:16px;animation:ring 7s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 8px 30px var(--glow-or),0 0 0 8px transparent}}
.fab{display:none;position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 12px 32px var(--glow-or);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.fab.hide{opacity:0;pointer-events:none;transform:translateY(24px)}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;padding:48px 0 52px}
.ph{width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font:800 40px Inter;color:#fff;overflow:hidden;box-shadow:0 0 0 6px var(--card),0 0 0 8px var(--or),0 20px 60px var(--glow);animation:up 1.4s var(--ease) both,breathe 12s ease-in-out infinite 1.5s}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.flip{overflow:visible;background:none;box-shadow:none;border-radius:0;display:block;perspective:900px;animation:up 1.4s var(--ease) both}
.ph.flip .fl{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.ph.flip .fc{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 0 6px var(--card),0 0 0 8px var(--or),0 20px 60px var(--glow);-webkit-backface-visibility:hidden;backface-visibility:hidden;animation:breathe 12s ease-in-out infinite 1.5s}
.ph.flip .fc.bk{transform:rotateY(180deg)}
.ph.flip{cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.ph.flip:focus-visible{outline:2px solid var(--acc);outline-offset:10px;border-radius:50%}
.ph.flip img{-webkit-user-drag:none;pointer-events:none}
.ph.flip .fc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.ph.flip .fc img.on{display:block}
@keyframes breathe{50%{box-shadow:0 0 0 6px var(--card),0 0 0 8px var(--or),0 26px 80px var(--glow)}}
.hero>div:last-child>*{animation:up 1.2s var(--ease) both}
.hero>div:last-child>*:nth-child(2){animation-delay:.18s}.hero>div:last-child>*:nth-child(3){animation-delay:.34s}.hero>div:last-child>*:nth-child(4){animation-delay:.5s}
@keyframes up{from{opacity:0;transform:translateY(var(--dy,16px))}}
.tag{display:inline-flex;gap:8px;align-items:center;font:500 12px 'JetBrains Mono',Vazirmatn,monospace;color:var(--acc);background:var(--glow);padding:5px 12px;border-radius:99px}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--or);animation:p 3s infinite}
@keyframes p{50%{opacity:.3}}
h1{font-size:clamp(32px,6vw,54px);line-height:1.12;margin:14px 0 8px;letter-spacing:-.03em}
html[lang=fa] h1{letter-spacing:0;line-height:1.35}
.pron{display:inline-flex;align-items:center;gap:8px;vertical-align:middle;margin-inline-start:10px;font:500 13px 'JetBrains Mono',monospace;letter-spacing:0;color:var(--acc2);background:var(--tint);border:1px dashed var(--line);padding:3px 10px;border-radius:99px;white-space:nowrap}
.pron.has-btn{padding:3px 4px 3px 12px}
.g{background:linear-gradient(90deg,var(--acc),var(--acc2) 55%,var(--or));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:18px;margin:0 0 22px;max-width:560px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.sec{display:contents}.btn .sm{display:none}
.vplay{width:28px;height:28px;border-radius:50%;border:0;background:var(--or);color:var(--onor);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.vplay[hidden]{display:none}
.vplay:hover{transform:scale(1.08);box-shadow:0 6px 18px var(--glow-or)}
.vplay svg{width:15px;height:15px;stroke-width:2}
.vplay.on{animation:vpulse 3s ease-in-out infinite}
@keyframes vpulse{50%{box-shadow:0 0 0 7px var(--glow-or)}}
/* sections */
section{padding:56px 0;position:relative}
.wrap>section:nth-of-type(even){background:var(--tint);box-shadow:0 0 0 100vmax var(--tint);clip-path:inset(0 -100vmax)}
.wrap>section.contact{background:var(--tintc);box-shadow:0 0 0 100vmax var(--tintc)}
h2{font:600 13px 'JetBrains Mono',Vazirmatn,monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:0 0 20px;display:flex;align-items:center;gap:10px}
h2:before{content:"";width:22px;height:3px;border-radius:3px;background:var(--or)}
html[lang=fa] h2{letter-spacing:0;text-transform:none;font-size:14px}
h2:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;transition:transform .5s var(--ease),border-color .5s var(--ease),box-shadow .5s var(--ease)}
.card:hover{transform:translateY(-3px);border-color:var(--acc2);box-shadow:0 16px 44px var(--glow)}
.card:hover .ico{transform:scale(1.05) rotate(-3deg)}
.card h3{margin:0 0 6px;font-size:16px}.card h3 svg.i{width:14px;height:14px;vertical-align:-1px}
.card p{margin:0;color:var(--mute);font-size:14px}
.ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--glow);color:var(--acc);margin-bottom:12px;transition:transform .6s var(--ease)}
.ico svg.i{width:24px;height:24px}
.kpi{font:700 24px 'JetBrains Mono',monospace;color:var(--acc);margin-bottom:4px}
/* funnel */
.fn{display:grid;gap:3px;max-width:820px}
.fr{display:grid;grid-template-columns:clamp(96px,28%,230px) 1fr;gap:22px}
.fshape{min-height:98px;display:grid;place-items:center;font:700 13px 'JetBrains Mono',monospace;color:var(--t,#fff);background:var(--c);transform-origin:top}
.ftxt{align-self:center;padding:8px 0}.ftxt b{font-size:17px}.ftxt p{margin:2px 0 8px;color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border:1px solid var(--line);background:var(--card);border-radius:99px;font-size:13px;font-weight:500;transition:border-color .4s,color .4s}
.chip:hover{border-color:var(--or);color:var(--or)}
.sm .chip{font:500 12px 'JetBrains Mono',monospace;padding:3px 10px}
.loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;counter-reset:s}
.loop div{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:16px 16px 14px;counter-increment:s;font-size:14px}
.loop div:before{content:"0" counter(s);font:700 12px 'JetBrains Mono';color:var(--or);display:block;margin-bottom:4px}
.loop b{display:block;font-size:15px}.loop span{color:var(--mute)}
.tl{border-inline-start:2px solid var(--line);margin-inline-start:6px;padding-inline-start:22px}
.tl .it{margin-bottom:22px;position:relative}.tl .it:last-child{margin-bottom:0}
.tl .it:before{content:"";position:absolute;inset-inline-start:-29px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--glow)}
.tl .it:first-child:before{background:var(--or);box-shadow:0 0 0 4px var(--glow-or)}
.tl h3{margin:0;font-size:16px}.tl small{color:var(--mute)}.tl ul{margin:6px 0 0;padding-inline-start:18px;color:var(--mute);font-size:14px}
/* form */
.intro{color:var(--mute);margin:0 0 16px;max-width:560px;font-size:17px}
.cform{position:relative;display:grid;gap:16px;max-width:700px;border-top:3px solid var(--or);padding:24px}
.fld{display:grid;gap:6px;align-content:start}
.fld>label{font-size:13px;font-weight:600;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.fld>label em{font-style:normal;font-weight:500;opacity:.8}
.cform input,.cform textarea{font:400 16px/1.5 inherit;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;resize:vertical;transition:border-color .4s,box-shadow .4s}
.cform input:focus,.cform textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
.cform [aria-invalid=true]{border-color:#d93a3a}
.cform [aria-invalid=true]:focus{box-shadow:0 0 0 3px rgba(217,58,58,.18)}
.err{color:#d93a3a;font-size:13px;min-height:0;margin:0;display:none}
.err.on{display:block}
:root[data-theme=dark] .err,:root[data-theme=dark] #cfmsg.bad{color:#ff7b7b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .err{color:#ff7b7b}}
.note{margin:0;font-size:12px;color:var(--mute)}
.cnt{font-size:12px;color:var(--mute);justify-self:end;font-family:'JetBrains Mono',monospace}
.cnt.over{color:#d93a3a}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.hp{position:absolute;inset-inline-start:0;top:0;opacity:0;height:0;width:0;overflow:hidden;pointer-events:none}
#cfmsg{font-size:14px;color:var(--mute);margin:0}
#cfmsg.ok{color:var(--acc);font-weight:600}
footer{padding:36px 0 8px;text-align:center;color:var(--mute);font-size:13px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(90px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;transition:transform .6s var(--ease);z-index:20}
.toast.on{transform:translateX(-50%)}
/* reveal */
.rv{opacity:0;transition:opacity 1.1s var(--ease)}.rv.in{opacity:1}
.rv.in .grid>*,.rv.in .loop>*,.rv.in .fr,.rv.in .it,.rv.in .cform,.rv.in .chips>*,.rv.in .intro{animation:up 1.1s var(--ease) both;animation-delay:calc(var(--i,0)*120ms)}
.rv.in .fshape{animation:grow 1.5s var(--ease) both;animation-delay:calc(var(--i,0)*200ms)}
@keyframes grow{from{transform:scaleY(.15);opacity:0}}
/* popup */
.pop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;visibility:hidden;opacity:0;transition:opacity .7s var(--ease),visibility 0s .7s}
.pop.on{visibility:visible;opacity:1;transition:opacity .7s var(--ease)}
.pop-bd{position:absolute;inset:0;background:rgba(10,18,14,.5);backdrop-filter:blur(3px)}
.pop-card{position:relative;width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-top:4px solid var(--or);border-radius:22px;padding:30px 26px 24px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:translateY(18px) scale(.97);transition:transform .8s var(--ease)}
.pop.on .pop-card{transform:none}
.pop-card:focus{outline:none}
.pop-x{position:absolute;top:12px;inset-inline-end:12px;border:0;background:none;color:var(--mute);cursor:pointer;padding:8px;border-radius:10px}
.pop-x:hover{background:var(--glow);color:var(--ink)}
.cup{position:relative;width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--glow-or);color:var(--or)}
.cup svg.i{width:38px;height:38px;stroke-width:1.6}
.pop-card h3{margin:0 0 8px;font-size:22px;line-height:1.3}
.pop-card p{margin:0 0 20px;color:var(--mute);font-size:15px}
.pop-card .row{justify-content:center}
@media (max-width:760px){
nav#nav{position:absolute;left:0;right:0;top:100%;bottom:auto;height:calc(100vh - var(--th,58px) - env(safe-area-inset-top,0px) + 2px);height:calc(100dvh - var(--th,58px) - env(safe-area-inset-top,0px) + 2px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px;box-shadow:0 -1px 0 var(--line);flex-direction:column;align-items:stretch;gap:0;padding:16px 20px;margin:0;transform:translateY(-14px);opacity:0;pointer-events:none;transition:opacity .5s var(--ease),transform .5s var(--ease);z-index:4}
nav#nav.open{transform:none;opacity:1;pointer-events:auto}
html.menu-lock{overflow:hidden}
html.menu-lock .fab{opacity:0;pointer-events:none}

nav#nav a{font-size:24px;font-weight:700;padding:16px 8px;color:var(--ink);border-bottom:1px solid var(--line);border-radius:0;background:none}
nav#nav a.on{color:var(--acc);background:none}nav#nav a.c{color:var(--or);background:none}
.logo{margin-inline-end:auto}
#menu{display:inline-flex}.fab{display:inline-flex}
.hero{grid-template-columns:1fr;text-align:center;justify-items:center;padding:32px 0 44px}.row{justify-content:center}
.pron{display:flex;width:max-content;margin:8px auto 0}
.cta{width:100%}
.sec{display:flex;flex-wrap:nowrap;gap:8px;width:100%}
.sec .btn{flex:1 1 0;min-width:0;padding:11px 6px;font-size:13px;gap:6px;white-space:nowrap}
.btn .lg{display:none}.btn .sm{display:inline}
section{padding:44px 0}
.two{grid-template-columns:1fr}
.cform{padding:20px 16px}
.fr{grid-template-columns:84px 1fr;gap:14px}
.pop{place-items:end center;padding:0}
.pop-card{width:100%;border-radius:22px 22px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(40px)}
.pop-card .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1}}
@media (max-width:359px){.top{gap:6px}.top .row{gap:6px}.logo{font-size:12px}.btn.icon{padding:10px}}
</style>

(function(){

  const cio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)vis.add(e.target);else{vis.delete(e.target);e.target.style.translate=''}}),{rootMargin:'80px 0px'});
  cards.forEach(c=>cio.observe(c));
  let queued=false;
  function frame(){queued=false;
    const m=innerWidth<760?.5:1,y=scrollY,vh=innerHeight;
    if(b1)b1.style.translate='0 '+(-Math.min(y,1500)*.04*m).toFixed(1)+'px';
    if(b2)b2.style.translate='0 '+(-Math.min(y,1500)*.07*m).toFixed(1)+'px';
    if(ph)ph.style.translate='0 '+(Math.min(y,320)*.08*m).toFixed(1)+'px';
    vis.forEach(c=>{const r=c.getBoundingClientRect(),cy=r.top+r.height/2-(off.get(c)||0),
      o=-Math.max(-1,Math.min(1,(cy-vh/2)/(vh/2)))*3.5*m;off.set(c,o);c.style.translate='0 '+o.toFixed(2)+'px'})}
  const req=()=>{if(!queued){queued=true;requestAnimationFrame(frame)}};
  addEventListener('scroll',req,{passive:true});addEventListener('resize',req);req();

  const seenOnce=new WeakSet(),lastAt=new WeakMap();

    if(!seenOnce.has(el)){seenOnce.add(el);return}

$('pdf').onclick=async()=>{
  const bin=atob(PDF[lang]),blob=new Blob([Uint8Array.from(bin,c=>c.charCodeAt(0))],{type:'application/pdf'}),name='Mahdi-Khani-Resume-'+lang.toUpperCase()+'.pdf';
  dl({event:'file_download',file_name:name,file_extension:'pdf',link_id:'pdf',link_text:U.pdf});
  try{const dlc=window.claude&&await window.claude.use('downloads');if(dlc){await dlc.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
};
